data_dir = "data"
unsafe_words = []

[persona]
name = "B站评论机器人"
personality = "温柔、真诚，有一点俏皮的日常陪伴者"
warmth = 0.8
humor = 0.5
empathy = 0.8

[platform]
bot_uid = 0 # 扫码成功后读取账号 UID；配置非零时必须与登录账号一致
poll_interval = 30
refresh_interval = 1800
write_interval = 15
request_timeout = 20
max_pages = 20
history_lookback_seconds = 3600 # 首次启动仅处理最近一小时；边界在首次 HTTP 前持久化

[ai]
backend = "api" # 或 local_mlx；本地模型在 [local] 设置
base_url = "https://api.openai.com/v1"
model = "" # 或用 BILI_BOT_AI_MODEL 环境变量
temperature = 0.7 # 模型采样；与 persona.warmth 分开
structured_output = "json_object" # json_schema / prompt，按供应商能力显式选择
token_parameter = "max_completion_tokens" # 旧兼容供应商可用 max_tokens
send_temperature = true # 不支持该参数的模型设 false
retries = 0 # 仅 429/503 可有限重试；平台写入不沿用这个设置
max_calls_per_minute = 120
max_input_chars = 120000

[limits]
dm_per_hour = 5
comment_per_hour = 5
whitelist = [] # 仅豁免额度；仍要求关注和安全检查
concurrency = 3
max_reply_chars = 800

[discovery]
keywords = ["日常", "搞笑"]
invite_uids = [] # 填数字 UID；bot 从平台核对名字，再构造真实 @
interval = 1800
pages_per_keyword = 1
videos_per_cycle = 10

[publishing]
dry_run = true
publish_enabled = false

[evidence]
cache_ttl = 3600
max_video_seconds = 1800
transcription_enabled = false
transcription_model = "whisper-1"
subtitle_languages = ["zh-CN", "ai-zh", "zh-Hans", "en"] # 依次优先；处理整个视频全部分 P
comment_sample_size = 20 # 热门评论样本；不代表全部观众
max_download_mb = 64 # 整部视频累计字幕+音频+画面视频下载预算
max_text_chars = 60000

[transcription]
backend = "api" # 或 local_mlx，无需转写密钥
base_url = "https://api.openai.com/v1" # 独立转写服务；新安装在网页填写密钥，旧部署可用环境变量导入
language = "zh" # ISO-639-1 提示；空字符串由服务自动识别
timeout = 120
concurrency = 1
max_upload_bytes = 24000000 # 单次 M4A 上传，超过预算不截断转写
max_calls_per_video = 20 # 整部多 P 共用，不按分 P 重置
max_calls_per_minute = 20
max_response_bytes = 1000000
max_text_chars = 60000

[runtime]
worker_interval = 2
batch_size = 20 # 每个处理入口一次最多认领；不一次排空历史
shutdown_timeout = 30 # 停止接收新工作后，最多等待在途任务的秒数
status_interval = 10

# Apple Silicon 原生运行；推荐在网页「本地模型」应用 20GB 方案。
[local]
model = "mlx-community/Qwen3-VL-4B-Instruct-4bit"
speech_model = "mlx-community/whisper-large-v3-turbo"
memory_gb = 16 # MLX 分配预算；不是整个进程/系统的硬上限
timeout = 900 # 每个本地任务，排队不占用模型执行时间
context_tokens = 8192 # 输入含图片 + 输出；超限明确失败，不截断

[vision]
enabled = false
max_frames = 24 # 所有分 P 共用，均分到各 P 后在段内均匀采样
frames_per_batch = 4
long_edge = 768
max_tokens = 600
download_timeout = 120
