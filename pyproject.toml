[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bili-comment-bot"
version = "0.1.0"
description = "A personality-driven Bilibili companion and video discovery bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
keywords = ["bilibili", "bot", "companion", "video-summary"]
dependencies = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "cryptography>=45,<50",
  "qrcode[pil]>=8,<9",
]

[project.scripts]
bili-comment-bot = "bili_comment_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_comment_bot"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "tests", "scripts", "docs", "assets", "evals", ".github", ".githooks",
  "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CONTRIBUTING.md", "SECURITY.md",
  "pyproject.toml", "uv.lock", "config.example.toml", ".env.example",
  "Dockerfile", "compose.yaml", ".dockerignore", ".gitignore",
]
