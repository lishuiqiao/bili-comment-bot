[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bili-comment-bot"
version = "0.1.0"
description = "A personality-driven Bilibili companion and video discovery bot"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "cryptography>=45,<50",
  "qrcode[pil]>=8,<9",
]

[project.scripts]
bili-comment-bot = "bili_comment_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_comment_bot"]
