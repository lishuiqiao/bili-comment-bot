name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.2"
      - run: uv python install 3.11.14
      - run: uv sync --locked --extra local --python 3.11.14
      - name: Check public repository files
        run: python3 scripts/check_public_tree.py
      - run: uv run --locked --extra local pytest -q
      - run: uv run --locked --extra local ruff check --no-cache .
      - run: uv run --locked --extra local ruff format --check --no-cache .
      - run: uv run --locked --extra local bili-comment-bot --config config.example.toml config-check
      - run: uv run --locked --extra local bili-comment-bot demo
      - run: uv run --locked --extra local bili-comment-bot --config config.example.toml evaluate
      - name: Independent installed wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/bili-bot-wheel"
          uv export --locked --no-dev --no-emit-project --format requirements.txt > "$RUNNER_TEMP/bili-bot-requirements.txt"
          uv venv --python 3.11.14 "$RUNNER_TEMP/bili-bot-wheel-env"
          uv pip sync --python "$RUNNER_TEMP/bili-bot-wheel-env/bin/python" --require-hashes "$RUNNER_TEMP/bili-bot-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/bili-bot-wheel-env/bin/python" --no-deps "$RUNNER_TEMP"/bili-bot-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bili-bot-wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Compose
        run: |
          cp config.example.toml config.toml
          touch .env
          docker compose config --quiet
      - run: docker build --tag bili-comment-bot:ci .
      - run: python3 scripts/docker_smoke.py
